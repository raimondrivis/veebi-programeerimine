<h2>Aeg</h2>

<p>Nädalapäev: <span id="day"></span></p>

<p>Kuupäev: <span id="date"></span></p>

<p>Kellaaeg: <span id="time"></span></p>

<script>

const dayNames = [
    "pühapäev",
    "esmaspäev",
    "teisipäev",
    "kolmapäev",
    "neljapäev",
    "reede",
    "laupäev"
];

const folkMonths = [
    "näärikuu",
    "küünlakuu",
    "paastukuu",
    "jürikuu",
    "lehekuu",
    "jaanipäevakuu",
    "heinakuu",
    "lõikuskuu",
    "mihklikuu",
    "viinakuu",
    "kooljakuu",
    "jõulukuu"
];

const now = new Date();

document.getElementById("day").innerHTML =
    dayNames[now.getDay()];

document.getElementById("date").innerHTML =
    now.getDate() + ". " +
    folkMonths[now.getMonth()] + " " +
    now.getFullYear();

document.getElementById("time").innerHTML =
    now.toLocaleTimeString("et-EE");

</script>

</body>
